<div class="container d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-lg p-4 login-card">
    <div class="text-center mb-4">
      <img src="images/logolight.jpeg" alt="logo" class="login-logo mb-2" />
      <h2 class="fw-bold">Espace Admin</h2>
      <p class="text-muted">Veuillez vous connecter</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div *ngIf="invalid" class="text-danger mb-3">Login ou mot de passe incorrect</div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Login</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input type="text" class="form-control" formControlName="username" placeholder="admin" />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Mot de passe</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input
            type="password"
            class="form-control"
            formControlName="password"
            placeholder="admin1234"
          />
        </div>
      </div>

      <button
        class="c1 w-100 py-2 fw-bold d-flex align-items-center justify-content-center gap-2"
        type="submit"
      >
        <i class="bi bi-box-arrow-in-right"></i> Se connecter
      </button>
    </form>
  </div>
</div>
